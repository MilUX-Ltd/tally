name: ch probe
on:
  push:
    branches: [feature/companies-house]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I scripts/ch_probe.py
        env:
          CH_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
