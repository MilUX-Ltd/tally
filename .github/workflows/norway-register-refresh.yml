# Refreshes norway-register.json weekly from the Brønnøysund Register Centre's open register
# (NLOD 2.0, no key): Norwegian Tally companies deleted from the register, or in bankruptcy,
# winding up or compulsory dissolution.
#
# The run refuses to write if too many lookups fail or closed companies jump, runs the gate and
# the acceptance tests, and changes nothing but norway-register.json. A run that changes only the
# date proposes nothing. With the TALLY_REFRESH_TOKEN secret set it opens a pull request that
# merges itself when the required "checks" job passes (D-i26gb), unless the set of closed
# companies changed: that waits for review.
name: norway register refresh

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norway-register-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only from main: a run on another branch would carry that branch's commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build norway-register.json
        run: |
          cp norway-register.json "$RUNNER_TEMP/previous.json"
          python3 -I scripts/build_norway_register.py --previous "$RUNNER_TEMP/previous.json" > "$RUNNER_TEMP/build.log"
          grep -E "^==|^closed" "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
          # Only the date changed: keep the last file, so there is nothing to propose.
          if python3 -I -c "import json,sys;a,b=(json.load(open(p)) for p in sys.argv[1:]);[d.pop('generated') for d in (a,b)];sys.exit(a!=b)" "$RUNNER_TEMP/previous.json" norway-register.json; then
            cp "$RUNNER_TEMP/previous.json" norway-register.json
          fi
      - name: The gate and acceptance tests
        run: |
          python3 .github/scripts/check.py
          python3 -m unittest discover -s tests -t .
      - name: Check only norway-register.json changed
        id: diff
        run: |
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "No change." >> "$GITHUB_STEP_SUMMARY"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$changed" != " M norway-register.json" ]; then echo "Unexpected changes: $changed" >&2; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open a pull request and turn on auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TALLY_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TALLY_REFRESH_TOKEN is not set: norway-register.json was built and tested but not proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary=$(python3 -I -c "import json;d=json.load(open('norway-register.json'));print(f\"{len(d['closed'])} closed, {len(d['flagged'])} flagged\")")
          branch="norway-register-refresh/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "tally-norway-register-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("norway-register-refresh/")) | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by a newer refresh."; done
          gh auth setup-git
          git switch -c "$branch"
          git commit -qam "Refresh norway-register.json: $summary"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh norway-register.json: $summary" \
            --body "Automatic refresh from the Brønnøysund Register Centre's open register (NLOD 2.0). Only norway-register.json changes; the gate and acceptance tests passed in the refresh run. Merges automatically when the required checks pass, unless the set of closed companies changed."
          # A change in which companies are closed hides or restores companies on the site, so
          # it waits for a person to check it; anything else merges itself when the checks pass.
          if python3 -I -c "import json,sys;a,b=(sorted(r['brreg'] for r in json.load(open(p))['closed']) for p in sys.argv[1:]);sys.exit(a!=b)" "$RUNNER_TEMP/previous.json" norway-register.json; then
            gh pr merge "$branch" --auto --squash
          else
            gh pr comment "$branch" --body "The set of closed companies has changed. Check the companies added to or removed from \`closed\` before merging; this pull request does not merge itself."
            echo "Closed companies changed: pull request left for review." >> "$GITHUB_STEP_SUMMARY"
          fi
