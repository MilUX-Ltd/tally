# Temporary: checks every website twice, two hours apart, so the first published results are
# confirmed. Removed before merge.
name: website seed
on:
  push:
    branches: [feature/website-check]
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -I scripts/check_websites.py --out "$RUNNER_TEMP/first.json"
      - run: sleep 7200
      - run: python3 -I scripts/check_websites.py --previous "$RUNNER_TEMP/first.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: websites-json
          path: websites.json
