# Refreshes companies-house.json weekly from the Companies House Public Data API (Open
# Government Licence v3.0): Tally companies that have closed or are in an insolvency process,
# and defence companies formed and dissolved each year.
#
# The run refuses to write if too many lookups fail or closed companies more than double, runs
# the gate and the acceptance tests, and changes nothing but companies-house.json. With the
# TALLY_REFRESH_TOKEN secret set it opens a pull request that merges itself when the required
# "checks" job passes (D-i26gb).
name: companies house refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companies-house-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only from main: a run on another branch would carry that branch's commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build companies-house.json
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          cp companies-house.json "$RUNNER_TEMP/previous.json"
          python3 -I scripts/build_companies_house.py --previous "$RUNNER_TEMP/previous.json" > "$RUNNER_TEMP/build.log"
          grep -E "^==|^closed|^wrote" "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
      - name: The gate and acceptance tests
        run: |
          python3 .github/scripts/check.py
          python3 -m unittest discover -s tests -t .
      - name: Check only companies-house.json changed
        id: diff
        run: |
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "No change." >> "$GITHUB_STEP_SUMMARY"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$changed" != " M companies-house.json" ]; then echo "Unexpected changes: $changed" >&2; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open a pull request and turn on auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TALLY_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TALLY_REFRESH_TOKEN is not set: companies-house.json was built and tested but not proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary=$(python3 -c "import json;d=json.load(open('companies-house.json'));print(f\"{len(d['closed'])} closed, {len(d['flagged'])} flagged\")")
          branch="companies-house-refresh/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "tally-companies-house-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("companies-house-refresh/")) | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by a newer refresh."; done
          gh auth setup-git
          git switch -c "$branch"
          git commit -qam "Refresh companies-house.json: $summary"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh companies-house.json: $summary" \
            --body "Automatic refresh from the Companies House Public Data API (Open Government Licence v3.0). Only companies-house.json changes; the gate and acceptance tests passed in the refresh run. Merges automatically when the required checks pass."
          gh pr merge "$branch" --auto --squash
