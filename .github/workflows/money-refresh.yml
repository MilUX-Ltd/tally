# Refreshes money.json (the Money view's data) twice a week from Contracts Finder and
# Find a Tender award notices (Open Government Licence v3.0), and backfills older
# weeks towards 1 January 2023 as the request budget allows.
#
# The raw notices are kept in the Actions cache, never in the repo (they hold
# contact details). The run refuses to shorten the period, runs the gate and the
# acceptance tests, and changes nothing but money.json.
#
# With the TALLY_REFRESH_TOKEN secret set (a fine-grained token with contents and
# pull requests write on this repository only), it opens a pull request and turns on
# auto-merge, so the change lands when the required "checks" job passes. Without the
# secret it stops after the build and attaches money.json to the run for a look.
name: money refresh

on:
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:
    inputs:
      max_requests:
        description: Request budget for this run (the services allow about five a minute)
        default: '400'

permissions:
  contents: read

concurrency:
  group: money-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || '400' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Restore the raw notice cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/money-cache
          key: money-cache-${{ github.run_id }}
          restore-keys: money-cache-
      - name: Fetch new and older notices
        run: |
          case "$MAX_REQUESTS" in ''|*[!0-9]*) echo "max_requests must be a number" >&2; exit 1;; esac
          python3 -I scripts/build_money.py fetch --cache "$RUNNER_TEMP/money-cache" --complete-days --max-requests "$MAX_REQUESTS"
      - name: Save the raw notice cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/money-cache
          key: money-cache-${{ github.run_id }}
      - name: Build money.json
        run: |
          cp money.json "$RUNNER_TEMP/money-previous.json"
          python3 -I scripts/build_money.py build --cache "$RUNNER_TEMP/money-cache" --complete-days --previous "$RUNNER_TEMP/money-previous.json" > "$RUNNER_TEMP/build.log"
          grep -E "^coverage|^== Supplier size|^wrote" "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
      - name: The gate and acceptance tests
        run: |
          python3 .github/scripts/check.py
          python3 -m unittest discover -s tests -t .
      - name: Check only money.json changed
        id: diff
        run: |
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "No change to money.json." >> "$GITHUB_STEP_SUMMARY"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$changed" != " M money.json" ]; then echo "Unexpected changes: $changed" >&2; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Keep money.json with the run
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: money-json
          path: money.json
          retention-days: 30
      - name: Open a pull request and turn on auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TALLY_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TALLY_REFRESH_TOKEN is not set: money.json was built and tested but not proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          period=$(python3 -c "import json;p=json.load(open('money.json'))['period'];print(p['from'],'to',p['to'])")
          branch="money-refresh/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "tally-money-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Refresh money.json: awards $period"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" --title "Refresh money.json: awards $period" \
            --body "Automatic refresh from Contracts Finder and Find a Tender (Open Government Licence v3.0). Only money.json changes; the period was not shortened; the gate and acceptance tests passed in the refresh run. Merges automatically when the required checks pass."
          gh pr merge "$branch" --auto --squash
