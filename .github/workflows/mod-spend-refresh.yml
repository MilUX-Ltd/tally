# Refreshes mod-spend.json monthly from MOD's official statistics on regional expenditure with
# industry (card 7475). A new edition appears once a year; in other months nothing changes and
# nothing is proposed. Changes nothing but mod-spend.json, runs the gate and the acceptance
# tests, and with TALLY_REFRESH_TOKEN set opens a pull request that merges itself when the
# required "checks" job passes (D-i26gb).
name: mod spend refresh

on:
  schedule:
    - cron: '0 4 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-spend-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only from main: a run on another branch would carry that branch's commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build mod-spend.json
        run: |
          cp mod-spend.json "$RUNNER_TEMP/previous.json"
          python3 -I scripts/build_mod_spend.py --previous "$RUNNER_TEMP/previous.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The gate and acceptance tests
        run: |
          python3 .github/scripts/check.py
          python3 -m unittest discover -s tests -t .
      - name: Check only mod-spend.json changed
        id: diff
        run: |
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "No change." >> "$GITHUB_STEP_SUMMARY"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$changed" != " M mod-spend.json" ]; then echo "Unexpected changes: $changed" >&2; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open a pull request and turn on auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TALLY_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TALLY_REFRESH_TOKEN is not set: mod-spend.json was built and tested but not proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary=$(python3 -I -c "import json;d=json.load(open('mod-spend.json'));y=d['years'][-1];print(f\"{y}, UK total £{d['uk'][y]/1e9:.1f}bn\")")
          branch="mod-spend-refresh/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "tally-mod-spend-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("mod-spend-refresh/")) | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by a newer refresh."; done
          gh auth setup-git
          git switch -c "$branch"
          git commit -qam "Refresh mod-spend.json: $summary"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh mod-spend.json: $summary" \
            --body "Automatic monthly refresh from MOD's official statistics on regional expenditure with industry. Only mod-spend.json changes; the gate and acceptance tests passed in the run. Merges automatically when the required checks pass."
          gh pr merge "$branch" --auto --squash
